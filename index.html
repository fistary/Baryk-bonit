<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#183a5a" />
    <meta name="description" content="Společný plán obsazení baryton saxofonu Big Bandu Bonit." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Baryton - Bonit</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">BIG BAND BONIT</p>
          <h1>Baryton</h1>
        </div>
        <div class="hero-actions">
          <button id="pdf-button" class="button button-light" type="button">Exportovat PDF</button>
          <button id="login-button" class="button button-light" type="button">Přihlásit se</button>
        </div>
      </header>

      <section class="summary" aria-label="Stav obsazení">
        <button class="summary-item active" type="button" data-filter="all"><strong id="count-all">0</strong><span>vše</span></button>
        <button class="summary-item" type="button" data-filter="mine"><strong id="count-mine">0</strong><span id="mine-label">já</span></button>
        <button class="summary-item" type="button" data-filter="friend"><strong id="count-friend">0</strong><span id="friend-label">kolega</span></button>
        <button class="summary-item warning" type="button" data-filter="open"><strong id="count-open">0</strong><span>k domluvě</span></button>
      </section>

      <section class="toolbar" aria-label="Nástroje">
        <button id="add-event" class="button button-primary admin-only" type="button" hidden>+ Přidat termín</button>
        <button id="settings-button" class="button button-plain admin-only" type="button" hidden>Nastavení</button>
        <button id="password-button" class="button button-plain admin-only" type="button" hidden>Změnit heslo</button>
        <button id="logout-button" class="button button-plain admin-only" type="button" hidden>Odhlásit</button>
      </section>

      <section id="events" class="events" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>Pro tento výběr nejsou žádné termíny.</p>
    </main>

    <dialog id="event-dialog">
      <form id="event-form" method="dialog">
        <div class="dialog-heading"><h2 id="event-dialog-title">Přidat termín</h2><button class="icon-button" value="cancel" aria-label="Zavřít">×</button></div>
        <label>Datum<input id="event-date" name="date" type="date" required /></label>
        <label>Město / místo<input id="event-place" name="place" type="text" placeholder="Např. Děčín" required /></label>
        <label>Akce<input id="event-title" name="title" type="text" placeholder="Např. městský ples" required /></label>
        <label>Hraje<select id="event-player" name="player"><option value="open">K domluvě</option><option id="player-option-mine" value="mine">Já</option><option id="player-option-friend" value="friend">Kolega</option></select></label>
        <label>Poznámka<textarea id="event-note" name="note" rows="3" placeholder="Čas, doprava, podmínka…"></textarea></label>
        <input id="event-id" name="id" type="hidden" />
        <div class="dialog-actions"><button id="delete-event" class="button button-danger" type="button" hidden>Smazat</button><span></span><button class="button button-plain" type="button" data-close="event-dialog">Zrušit</button><button id="save-event" class="button button-primary" value="default">Uložit</button></div>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-heading"><h2>Nastavení</h2><button class="icon-button" value="cancel" aria-label="Zavřít">×</button></div>
        <p class="help">Jména se zobrazí v celém plánu i ve sdíleném odkazu. Plán se ukládá lokálně v prohlížeči tohoto zařízení.</p>
        <label>Moje jméno<input id="settings-mine" name="mine" type="text" required maxlength="30" /></label>
        <label>Jméno kolegy<input id="settings-friend" name="friend" type="text" required maxlength="30" /></label>
        <div class="dialog-actions"><span></span><button class="button button-plain" type="button" data-close="settings-dialog">Zrušit</button><button class="button button-primary" value="default">Uložit</button></div>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <form id="login-form" autocomplete="off">
        <div class="dialog-heading"><h2>Přihlášení správce</h2><button class="icon-button" type="button" data-close="login-dialog" aria-label="Zavřít">×</button></div>
        <p class="help">Úpravy se zpřístupní pouze správci.</p>
        <label>Uživatelské jméno<input id="login-username" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false" /></label>
        <label>Heslo<input id="login-password" type="password" required autocomplete="off" /></label>
        <div class="dialog-actions"><span></span><button class="button button-plain" type="button" data-close="login-dialog">Zrušit</button><button class="button button-primary" type="submit">Přihlásit se</button></div>
      </form>
    </dialog>

    <dialog id="password-dialog">
      <form id="password-form">
        <div class="dialog-heading"><h2>Nastavit heslo</h2><button class="icon-button" type="button" data-close="password-dialog" aria-label="Zavřít">×</button></div>
        <label>Nové heslo<input id="new-password" type="password" required minlength="8" autocomplete="new-password" /></label>
        <label>Heslo znovu<input id="new-password-confirm" type="password" required minlength="8" autocomplete="new-password" /></label>
        <div class="dialog-actions"><span></span><button class="button button-plain" type="button" data-close="password-dialog">Zrušit</button><button class="button button-primary" type="submit">Uložit heslo</button></div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
